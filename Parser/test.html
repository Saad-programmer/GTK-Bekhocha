<window title="My Test App" width="600" height="400" bgcolor="#f0f0f0">
    
  <vbox spacing="10" margin="20">
    
    <label text="Welcome to GTK Parser!" color="#2c3e50" font="Arial" style="bold" position="center"/>
    
    <label text="This is a test interface" color="#34495e" position="center"/>
    
    <hbox spacing="10">
      <button label="Button 1" bgcolor="#4CAF50" width="100" height="35"/>
      <button label="Button 2" bgcolor="#2196F3" width="100" height="35"/>
    </hbox>
    
    <entry placeholder="Enter your name..." width="300"/>
    
    <checkbox active="true">Enable notifications</checkbox>
    
    <radiobutton group="colors" active="true">Red</radiobutton>
    <radiobutton group="colors">Green</radiobutton>
    <radiobutton group="colors" label="Blue"/>
    
    <label text="Groupe 2" color="#2c3e50" font="Arial" style="italic" position="center"/>
    <radiobutton group="test" active="true">Red</radiobutton>
    <radiobutton group="test">Green</radiobutton>
    <radiobutton group="test" label="Blue"/>
  </vbox>
  
</window>
